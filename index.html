<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorteo Donna</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
    overflow:hidden;
    color:white;

    background:url('https://raw.githubusercontent.com/jgalindoduvan-hue/donna-proyectos/main/176271-el_espacio_tridimensional-morado-triangulo-violeta-material_propiedad-3840x2160.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    backdrop-filter:blur(3px);
    z-index:0;
}

/* =========================
   CONTENEDOR
========================= */

.container{
    position:relative;
    z-index:2;
    width:100%;
    max-width:950px;

    background:rgba(10,10,10,.70);

    border-radius:30px;

    padding:35px;

    backdrop-filter:blur(12px);

    box-shadow:
        0 0 40px rgba(183,0,255,.45),
        inset 0 0 25px rgba(255,255,255,.03);

    transition:.6s;
}

/* =========================
   TOP
========================= */

.top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
    margin-bottom:30px;
}

.logo{
    width:150px;

    animation:respirar 3s infinite ease-in-out;

    filter:
        drop-shadow(0 0 15px #ff00ff)
        drop-shadow(0 0 35px #b700ff)
        drop-shadow(0 0 60px #7b00ff);
}

@keyframes respirar{

    0%{
        transform:scale(1);
    }

    50%{
        transform:scale(1.10);
    }

    100%{
        transform:scale(1);
    }
}

.titulo{
    flex:1;
    text-align:center;
}

.titulo h1{

    font-size:60px;

    text-shadow:
        0 0 15px #ff00ff,
        0 0 35px #b700ff,
        0 0 60px #7b00ff;
}

.titulo p{
    margin-top:10px;
    font-size:20px;
    color:#d9b8ff;
}

/* =========================
   TEXTAREA
========================= */

textarea{

    width:100%;

    height:230px;

    resize:none;

    border:none;

    outline:none;

    border-radius:22px;

    padding:20px;

    background:rgba(0,0,0,.65);

    color:white;

    font-size:17px;

    margin-bottom:25px;

    border:1px solid rgba(255,255,255,.08);
}

/* =========================
   BOTÓN
========================= */

button{

    width:100%;

    padding:20px;

    border:none;

    border-radius:22px;

    cursor:pointer;

    font-size:24px;

    font-weight:bold;

    color:white;

    background:linear-gradient(45deg,#ff00ff,#6a00ff);

    transition:.25s;

    box-shadow:
        0 0 25px rgba(183,0,255,.6);
}

button:hover{
    transform:scale(1.02);
}

/* =========================
   RULETA
========================= */

.ruleta{

    margin-top:35px;

    height:340px;

    overflow:hidden;

    position:relative;

    border-radius:25px;

    background:rgba(0,0,0,.55);

    border:2px solid rgba(255,255,255,.08);
}

.linea{

    position:absolute;

    left:0;
    right:0;

    top:50%;

    height:6px;

    background:#ff00ff;

    transform:translateY(-50%);

    box-shadow:0 0 25px #ff00ff;

    z-index:10;
}

.cinta{

    position:absolute;

    left:0;
    top:0;

    width:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    gap:22px;

    padding:25px 0;
}

.item{

    width:85%;

    min-height:90px;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:15px;

    border-radius:20px;

    background:rgba(255,255,255,.06);

    border:1px solid rgba(255,255,255,.08);

    font-size:25px;

    font-weight:bold;

    backdrop-filter:blur(5px);

    transition:.3s;
}

/* =========================
   FINAL
========================= */

.final{

    position:fixed;

    inset:0;

    z-index:9999;

    display:none;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    animation:fade .7s;
}

@keyframes fade{

    from{
        opacity:0;
        transform:scale(1.05);
    }

    to{
        opacity:1;
        transform:scale(1);
    }
}

.logoFinal{

    width:320px;

    margin-bottom:35px;

    animation:respirar 2.5s infinite ease-in-out;

    filter:
        drop-shadow(0 0 20px #ff00ff)
        drop-shadow(0 0 45px #b700ff)
        drop-shadow(0 0 80px #7b00ff);
}

.final h1{

    font-size:90px;

    margin-bottom:25px;

    text-shadow:
        0 0 20px #ff00ff,
        0 0 45px #7b00ff;
}

.winner{

    font-size:60px;

    font-weight:bold;

    max-width:90%;

    word-break:break-word;

    text-shadow:
        0 0 15px #ff00ff,
        0 0 35px #7b00ff;
}

</style>
</head>
<body>

<!-- =========================
     CONTENIDO
========================= -->

<div class="container" id="container">

    <div class="top">

        <img class="logo"
        src="https://raw.githubusercontent.com/jgalindoduvan-hue/donna-proyectos/main/WhatsApp%20Image%202026-05-15%20at%2013.42.35-Photoroom.png">

        <div class="titulo">

            <h1>🎉SORTEO DONNA🎉</h1>

            <p>
               ganador aleatorio
            </p>

        </div>

        <img class="logo"
        src="https://raw.githubusercontent.com/jgalindoduvan-hue/donna-proyectos/main/WhatsApp%20Image%202026-05-15%20at%2013.42.35-Photoroom.png">

    </div>

    <textarea id="lista"
    placeholder="Pega aquí los participantes..."></textarea>

    <button onclick="iniciarRuleta()">
        🎲 ELEGIR GANADOR
    </button>

    <div class="ruleta">

        <div class="linea"></div>

        <div class="cinta" id="cinta"></div>

    </div>

</div>

<!-- =========================
     FINAL
========================= -->

<div class="final" id="pantallaFinal">

    <img class="logoFinal"
    src="https://raw.githubusercontent.com/jgalindoduvan-hue/donna-proyectos/main/WhatsApp%20Image%202026-05-15%20at%2013.42.35-Photoroom.png">

    <h1>🏆 GANADOR 🏆</h1>

    <div class="winner" id="winnerText">
        ---
    </div>

</div>

<script>

let animando = false;

function obtenerParticipantes(){

    let lista =
    document.getElementById("lista").value
    .split("\n")
    .map(x => x.trim())
    .filter(x => x.length > 0);

    // quitar duplicados
    lista = [...new Set(lista)];

    return lista;
}

function iniciarRuleta(){

    if(animando) return;

    const participantes =
    obtenerParticipantes();

    if(participantes.length < 2){

        alert("Agrega mínimo 2 participantes");

        return;
    }

    animando = true;

    const cinta =
    document.getElementById("cinta");

    cinta.innerHTML = "";

    // GANADOR REAL
    const ganador =
    participantes[
        Math.floor(Math.random() * participantes.length)
    ];

    let mezcla = [];

    // MUCHAS VUELTAS COMPLETAS
    // TODOS LOS PARTICIPANTES APARECEN
    for(let v=0; v<8; v++){

        let copia = [...participantes];

        // mezclar orden
        copia.sort(() => Math.random() - 0.5);

        // agregar todos
        mezcla.push(...copia);
    }

    // POSICIÓN GANADOR
    const posicionGanador = mezcla.length;

    // GANADOR
    mezcla.push(ganador);

    // MÁS DESPUÉS DEL GANADOR
    for(let v=0; v<3; v++){

        let copia = [...participantes];

        copia.sort(() => Math.random() - 0.5);

        mezcla.push(...copia);
    }

    // CREAR ITEMS
    mezcla.forEach((nombre,index)=>{

        const div =
        document.createElement("div");

        div.className = "item";

        div.innerText = nombre;

        // MARCAR GANADOR
        if(index === posicionGanador){

            div.id = "itemGanador";
        }

        cinta.appendChild(div);

    });

    // RESET
    cinta.style.transition = "none";

    cinta.style.transform = "translateY(0px)";

    setTimeout(()=>{

        const itemGanador =
        document.getElementById("itemGanador");

        const ruleta =
        document.querySelector(".ruleta");

        const centro =
        ruleta.offsetHeight / 2;

        const destino =
        itemGanador.offsetTop -
        centro +
        (itemGanador.offsetHeight / 2);

        // ANIMACIÓN
        cinta.style.transition =
        "transform 10s cubic-bezier(.08,.8,.17,1)";

        cinta.style.transform =
        `translateY(-${destino}px)`;

        // FINAL
        setTimeout(()=>{

            itemGanador.style.background =
            "linear-gradient(45deg,#ff00ff,#6a00ff)";

            itemGanador.style.boxShadow =
            "0 0 45px #ff00ff";

            itemGanador.style.transform =
            "scale(1.08)";

            // OCULTAR PANEL
            document.getElementById("container")
            .style.opacity = "0";

            // MOSTRAR GANADOR
            setTimeout(()=>{

                document.getElementById("container")
                .style.display = "none";

                document.getElementById("pantallaFinal")
                .style.display = "flex";

                document.getElementById("winnerText")
                .innerText = ganador;

                animando = false;

            },900);

        },10000);

    },100);

}

</script>

</body>
</html>
